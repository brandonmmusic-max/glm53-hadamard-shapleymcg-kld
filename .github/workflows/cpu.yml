name: CPU codec

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run focused codec tests
        run: pytest -q tests/test_p4_codec.py tests/test_trellismx_package.py tests/test_trellismx_cli.py tests/test_trellismx_protocol.py tests/test_trellismx_workflow.py tests/test_trellismx_p8_fixture.py
