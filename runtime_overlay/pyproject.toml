[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trellismx-runtime-sm120"
version = "0.1.0"
description = "Source-only TrellisMX SM120 mixed-rate runtime overlay; not executable by installation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["trellismx_runtime_sm120"]
include-package-data = true

[tool.setuptools.package-data]
trellismx_runtime_sm120 = [
    "manifest.json",
    "py.typed",
    "overlay/**/*",
    "README.md",
    "LICENSE",
    "LICENSE.exllamav3",
    "LICENSE.b12x",
    "THIRD_PARTY_NOTICES.md",
]
