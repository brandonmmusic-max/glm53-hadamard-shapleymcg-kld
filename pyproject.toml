[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glm53-nvfp4"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "safetensors", "torch"]

[tool.setuptools.packages.find]
include = ["glm53_nvfp4*", "bmxfp4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
